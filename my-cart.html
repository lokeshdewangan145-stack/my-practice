<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>boxicons</title>
    <link rel="stylesheet" href="CART.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite" />
</head>
<body>  
    <div class="profile-cart">  
        <div class="image">
            <img src="my-image2.jpg" alt="image" class="profile-img" >

        </div>
        <div class="text-data">
            <span class="name"> sweety</span>
            <span class="job"> web-developer & creator  </span>
        </div>


        <div class="media-button">
            <a href="#" style="background-color: #e1306c;"  class="link">
                <i class='bx bxl-instagram'></i>
            </a>
              <a href="#"style="background-color: #4267b2;" class="link">
                <i class='bx bxl-facebook-square' ></i>
            </a>
              <a href="#" style="background-color: #1da1f2;"class="link">
                <i class='bx bxl-twitter' ></i>
            </a>
              <a href="#" style="background-color: #ff0000;"class="link">
                <i class='bx bxl-youtube' ></i>
            </a>
        </div>

        <div class="buttons">
            <button class="button"> subscribe</button>
            <button class="button"> message</button>
        </div>

        <div class="analytics">
            <div class="data">
                <i class='bx bx-heart'></i>
                <span class="number">60k</span>
            </div>

             <div class="data">
                <i class='bx bx-message-rounded'></i>
                <span class="number">40k</span>
            </div>

             <div class="data">
               <i class='bx bx-share' ></i>
                <span class="number">15k</span>
            </div>
            
        </div>
 
                 
    
        </div>

         
    </div>



    
    
</body>
</html>
